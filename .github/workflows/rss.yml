name: Build RSS feed

# 글은 Firestore에만 있고 이 저장소는 정적 페이지라서,
# 주기적으로 피드를 다시 만들어 커밋해야 새 글이 구독자에게 간다.
on:
  schedule:
    # 매시 17분(UTC). 새 글은 최대 한 시간 뒤에 피드에 올라온다.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-rss.mjs"
      - ".github/workflows/rss.yml"

permissions:
  contents: write

concurrency:
  group: build-rss
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate feed
        run: node scripts/build-rss.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain rss.xml rss/index.html)" ]; then
            echo "새 글이 없어 피드가 그대로입니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml rss/index.html
          git commit -m "Update RSS feed"
          git push
